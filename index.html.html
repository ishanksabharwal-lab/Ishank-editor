<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Podio Bulk Editor</title>
    
    <!-- Chosen Palette: "Calm Harmony" - A minimalistic palette with warm neutrals, a calming blue primary, and subtle accents for clarity and focus. -->
    <!-- Application Structure Plan: The application uses a task-oriented, single-view design. It starts with a secure, OAuth-based login. Once authenticated, the user enters the main "editor" view. This view is dominated by a workspace/app selector that drives the entire interface. Selecting an app populates a central, interactive data table. All actions (filtering, sorting, bulk editing) are contextual to this table. This structure was chosen to create a focused, step-by-step user flow (Select -> View -> Act) which is highly intuitive for a data manipulation tool and avoids the cognitive overhead of multiple pages or complex dashboards. -->
    <!-- Visualization & Content Choices: 
        - Report Info: User's Podio data (workspaces, apps, items). Goal: Selection & Navigation. Viz/Presentation: Hierarchical dropdowns. Interaction: Chained selection (workspace selection enables app selection). Justification: Mirrors Podio's structure, making it immediately familiar. Method: Dynamic HTML <select> elements.
        - Report Info: Podio App Items. Goal: Inform, Compare, Organize. Viz/Presentation: Interactive HTML Table. Interaction: Sorting by column headers, row selection via checkboxes. Justification: The most effective way to display and interact with structured, tabular data. Method: Dynamic HTML table generation.
        - Report Info: Bulk Update Actions. Goal: Modify Data. Viz/Presentation: Contextual action panel/modal. Interaction: Select field, input value, apply to all selected rows. Justification: Separates the action from the data view, preventing accidental edits and providing a clear workflow. Method: HTML forms and buttons.
        - Report Info: Application State Changes. Goal: Provide Safety Net. Viz/Presentation: Undo/Redo Buttons. Interaction: Click to revert or re-apply the last data state change. Justification: Critical for a bulk editing tool to prevent user error and build trust. Method: Client-side state management (past/present/future arrays).
    -->
    <!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->

    <script src="https://cdn.jsdelivr.net/npm/podio-js/dist/podio-js.min.js" defer></script>
    <script src="https://unpkg.com/lucide@latest" defer></script>
    
    <style>
        :root {
            --primary-color: #3498db;
            --primary-hover: #2980b9;
            --secondary-color: #f0f4f8;
            --border-color: #dce1e6;
            --font-color: #34495e;
            --success-color: #2ecc71;
            --danger-color: #e74c3c;
            --bg-color: #ffffff;
            --app-bg: #f8fafc;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; background-color: var(--app-bg); color: var(--font-color); font-size: 16px; line-height: 1.6; }
        .container { max-width: 1400px; margin: 2rem auto; padding: 2rem; background-color: var(--bg-color); box-shadow: 0 4px 15px rgba(0,0,0,0.07); border-radius: 12px; }
        h1, h2 { color: var(--primary-hover); }
        button { padding: 10px 18px; border: none; background-color: var(--primary-color); color: white; border-radius: 6px; cursor: pointer; transition: background-color 0.2s, box-shadow 0.2s; display: inline-flex; align-items: center; gap: 8px; font-weight: 500; }
        button:hover { background-color: var(--primary-hover); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        button:disabled { background-color: #bdc3c7; cursor: not-allowed; box-shadow: none; }
        .hidden { display: none !important; }
        #login-view { text-align: center; padding: 4rem; }
        .control-panel { display: flex; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem; align-items: center; padding: 1rem; background-color: var(--secondary-color); border-radius: 8px; }
        select, input[type="text"] { padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; min-width: 200px; font-size: 1rem; }
        .data-table-wrapper { overflow-x: auto; }
        .data-table { width: 100%; border-collapse: collapse; }
        .data-table th, .data-table td { border: 1px solid var(--border-color); padding: 12px 15px; text-align: left; vertical-align: top; }
        .data-table th { background-color: var(--secondary-color); font-weight: 600; cursor: pointer; user-select: none; }
        .data-table tr:nth-child(even) { background-color: #fdfdfd; }
        .data-table tr:hover { background-color: #eff6ff; }
        .action-bar { margin: 1.5rem 0; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
        .loader { text-align: center; padding: 4rem; font-size: 1.2rem; color: #7f8c8d; }
        .bulk-edit-panel { padding: 1.5rem; background-color: #e9f5ff; border: 1px solid #bde0ff; border-radius: 8px; margin-bottom: 1.5rem; }
        .bulk-edit-panel h3 { margin-top: 0; color: var(--primary-hover); }
        .bulk-edit-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; align-items: end; }
    </style>
</head>
<body>
    <div class="container">
        <header style="text-align: center; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem; margin-bottom: 2rem;">
            <h1>Podio Bulk Editor</h1>
        </header>

        <main>
            <section id="login-view">
                <h2>Welcome</h2>
                <p>Securely connect to your Podio account to begin.</p>
                <button id="login-btn">Login with Podio</button>
            </section>

            <section id="editor-view" class="hidden">
                <div class="control-panel">
                    <select id="workspace-selector"><option>Loading...</option></select>
                    <select id="app-selector" disabled><option>Select Workspace First</option></select>
                </div>

                <div id="bulk-edit-container"></div>

                <div class="action-bar">
                    <div>
                        <button id="undo-btn" disabled>Undo</button>
                        <button id="redo-btn" disabled>Redo</button>
                    </div>
                </div>

                <div id="table-container">
                    <div id="loader" class="loader hidden">Loading items...</div>
                    <div class="data-table-wrapper">
                        <table id="items-table" class="data-table hidden">
                            <thead></thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
    (function() {
        'use strict';

        window.PodioBulkEditor = {
            config: {
                clientId: 'YOUR_PODIO_CLIENT_ID', 
                appUrl: 'https://your-app.vercel.app', 
                proxyUrl: '/api/oauth-callback'
            },

            state: {
                auth: { accessToken: null, isAuthenticated: false },
                ui: { isLoading: false, currentView: 'login' },
                data: { orgs: [] },
                editor: {
                    past: [],
                    present: { items: [], appFields: [], selectedItemIds: new Set() },
                    future: []
                },
            },

            elements: {},

            init: function() {
                this.cacheDOMElements();
                this.bindEvents();
                this.auth.handleCallback();
            },

            cacheDOMElements: function() {
                const ids = ['login-view', 'editor-view', 'login-btn', 'workspace-selector', 'app-selector', 'table-container', 'items-table', 'loader', 'undo-btn', 'redo-btn', 'bulk-edit-container'];
                const toCamelCase = (s) => s.replace(/-./g, x => x[1].toUpperCase());
                
                ids.forEach(id => {
                    const camelCaseKey = toCamelCase(id);
                    this.elements[camelCaseKey] = document.getElementById(id);
                });
                
                if (this.elements.itemsTable) {
                    this.elements.itemsThead = this.elements.itemsTable.querySelector('thead');
                    this.elements.itemsTbody = this.elements.itemsTable.querySelector('tbody');
                }
            },

            bindEvents: function() {
                this.elements.loginBtn.addEventListener('click', () => this.auth.login());
                this.elements.workspaceSelector.addEventListener('change', (e) => this.handleWorkspaceSelect(e.target.value));
                this.elements.appSelector.addEventListener('change', (e) => this.handleAppSelect(e.target.value));
                this.elements.undoBtn.addEventListener('click', () => this.history.undo());
                this.elements.redoBtn.addEventListener('click', () => this.history.redo());
            },

            auth: {
                login: function() {
                    const { clientId, appUrl } = PodioBulkEditor.config;
                    const authUrl = `https://podio.com/oauth/authorize?client_id=${clientId}&redirect_uri=${appUrl}`;
                    window.location.href = authUrl;
                },
                handleCallback: async function() {
                    const code = new URLSearchParams(window.location.search).get('code');
                    if (code) {
                        PodioBulkEditor.ui.showView('editor'); // Show editor view immediately for better UX
                        PodioBulkEditor.ui.setLoading(true);
                        window.history.replaceState({}, document.title, window.location.pathname);
                        try {
                            const response = await fetch(PodioBulkEditor.config.proxyUrl, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ code }),
                            });
                            const data = await response.json();
                            if (!response.ok) throw new Error(data.error_description || 'Authentication failed');
                            PodioBulkEditor.state.auth.accessToken = data.access_token;
                            PodioBulkEditor.state.auth.isAuthenticated = true;
                            PodioBulkEditor.api.init();
                        } catch (error) {
                            console.error('Error during token exchange:', error);
                            alert('Failed to authenticate. Please try again.');
                            PodioBulkEditor.ui.showView('login');
                        }
                    }
                }
            },

            api: {
                podio: null,
                init: function() {
                    this.podio = new PodioJS({ authType: 'token' });
                    this.podio.setAccessToken(PodioBulkEditor.state.auth.accessToken);
                    this.fetchOrgs();
                },
                fetchOrgs: async function() {
                    try {
                        const orgs = await this.podio.request('GET', '/org/');
                        PodioBulkEditor.state.data.orgs = orgs;
                        PodioBulkEditor.ui.renderWorkspaceSelector(orgs);
                    } catch (err) { console.error('Failed to fetch orgs:', err); }
                },
                fetchAppAndItems: async function(appId) {
                    PodioBulkEditor.ui.setLoading(true);
                    try {
                        const appPromise = this.podio.request('GET', `/app/${appId}`);
                        const itemsPromise = this.podio.request('POST', `/item/app/${appId}/filter/`, { limit: 50 });
                        const [app, itemsResponse] = await Promise.all([appPromise, itemsPromise]);
                        PodioBulkEditor.history.updatePresent({ items: itemsResponse.items, appFields: app.fields, selectedItemIds: new Set() }, true);
                    } catch (err) {
                        console.error(`Failed to fetch data for app ${appId}:`, err);
                    } finally {
                        PodioBulkEditor.ui.setLoading(false);
                    }
                },
            },

            ui: {
                showView: function(viewName) {
                    const loginView = PodioBulkEditor.elements.loginView;
                    const editorView = PodioBulkEditor.elements.editorView;
                    if (viewName === 'editor') {
                        loginView.classList.add('hidden');
                        editorView.classList.remove('hidden');
                    } else {
                        loginView.classList.remove('hidden');
                        editorView.classList.add('hidden');
                    }
                },
                setLoading: function(isLoading) {
                    PodioBulkEditor.elements.loader.classList.toggle('hidden', !isLoading);
                    PodioBulkEditor.elements.itemsTable.classList.toggle('hidden', isLoading);
                },
                renderWorkspaceSelector: function(orgs) {
                    const selector = PodioBulkEditor.elements.workspaceSelector;
                    selector.innerHTML = '<option value="">Select a Workspace</option>';
                    orgs.forEach(org => {
                        const group = document.createElement('optgroup');
                        group.label = org.name;
                        org.spaces.forEach(space => {
                            const option = document.createElement('option');
                            option.value = space.space_id;
                            option.textContent = space.name;
                            option.dataset.apps = JSON.stringify(space.apps);
                            group.appendChild(option);
                        });
                        selector.appendChild(group);
                    });
                },
                renderAppSelector: function(apps) {
                    const selector = PodioBulkEditor.elements.appSelector;
                    selector.innerHTML = '<option value="">Select an App</option>';
                    apps.forEach(app => {
                        const option = document.createElement('option');
                        option.value = app.app_id;
                        option.textContent = app.config.name;
                        selector.appendChild(option);
                    });
                    selector.disabled = false;
                },
                render: function() {
                    this.renderItemsTable();
                    this.renderBulkEditPanel();
                    this.updateHistoryButtons();
                },
                renderItemsTable: function() {
                    const { items, appFields, selectedItemIds } = PodioBulkEditor.state.editor.present;
                    const { itemsThead, itemsTbody } = PodioBulkEditor.elements;
                    itemsThead.innerHTML = '';
                    itemsTbody.innerHTML = '';
                    if (!appFields || appFields.length === 0) return;

                    const headerRow = document.createElement('tr');
                    const selectAllCell = document.createElement('th');
                    const selectAllCheckbox = document.createElement('input');
                    selectAllCheckbox.type = 'checkbox';
                    selectAllCheckbox.checked = selectedItemIds.size > 0 && selectedItemIds.size === items.length;
                    selectAllCheckbox.addEventListener('change', (e) => PodioBulkEditor.handleSelectAll(e.target.checked));
                    selectAllCell.appendChild(selectAllCheckbox);
                    headerRow.appendChild(selectAllCell);

                    appFields.filter(f => f.status === 'active').forEach(field => {
                        const th = document.createElement('th');
                        th.textContent = field.label;
                        headerRow.appendChild(th);
                    });
                    itemsThead.appendChild(headerRow);

                    items.forEach(item => {
                        const row = document.createElement('tr');
                        const checkboxCell = document.createElement('td');
                        const checkbox = document.createElement('input');
                        checkbox.type = 'checkbox';
                        checkbox.value = item.item_id;
                        checkbox.checked = selectedItemIds.has(item.item_id);
                        checkbox.addEventListener('change', (e) => PodioBulkEditor.handleSelectItem(item.item_id, e.target.checked));
                        checkboxCell.appendChild(checkbox);
                        row.appendChild(checkboxCell);

                        appFields.filter(f => f.status === 'active').forEach(field => {
                            const td = document.createElement('td');
                            const itemField = item.fields.find(f => f.field_id === field.field_id);
                            td.textContent = this.formatFieldValue(itemField);
                            row.appendChild(td);
                        });
                        itemsTbody.appendChild(row);
                    });
                },
                renderBulkEditPanel: function() {
                    const { selectedItemIds } = PodioBulkEditor.state.editor.present;
                    const container = PodioBulkEditor.elements.bulkEditContainer;
                    if (selectedItemIds.size === 0) {
                        container.innerHTML = '';
                        return;
                    }
                    container.innerHTML = `
                        <div class="bulk-edit-panel">
                            <h3>Bulk Edit ${selectedItemIds.size} Items</h3>
                            <div class="bulk-edit-grid">
                                <!-- Panel content will be added here -->
                            </div>
                        </div>
                    `;
                },
                formatFieldValue: function(field) {
                    if (!field || !field.values || field.values.length === 0) return '';
                    const value = field.values[0];
                    switch (field.type) {
                        case 'text': return value.value;
                        case 'category': return value.value.text;
                        case 'date': return value.start_date;
                        default: return `[${field.type}]`;
                    }
                },
                updateHistoryButtons: function() {
                    PodioBulkEditor.elements.undoBtn.disabled = PodioBulkEditor.state.editor.past.length === 0;
                    PodioBulkEditor.elements.redoBtn.disabled = PodioBulkEditor.state.editor.future.length === 0;
                }
            },
            
            history: {
                updatePresent: function(newState, isNewState = false) {
                    const { past, present } = PodioBulkEditor.state.editor;
                    if (!isNewState) {
                        past.push(JSON.parse(JSON.stringify(present)));
                    } else {
                        PodioBulkEditor.state.editor.past = [];
                    }
                    PodioBulkEditor.state.editor.present = { ...present, ...newState };
                    PodioBulkEditor.state.editor.future = [];
                    PodioBulkEditor.ui.render();
                },
                undo: function() {
                    const { past, present, future } = PodioBulkEditor.state.editor;
                    if (past.length === 0) return;
                    future.unshift(JSON.parse(JSON.stringify(present)));
                    PodioBulkEditor.state.editor.present = past.pop();
                    PodioBulkEditor.ui.render();
                },
                redo: function() {
                    const { past, present, future } = PodioBulkEditor.state.editor;
                    if (future.length === 0) return;
                    past.push(JSON.parse(JSON.stringify(present)));
                    PodioBulkEditor.state.editor.present = future.shift();
                    PodioBulkEditor.ui.render();
                }
            },

            handleWorkspaceSelect: function(spaceId) {
                const selector = this.elements.workspaceSelector;
                if (!spaceId) {
                    this.elements.appSelector.innerHTML = '<option>Select Workspace First</option>';
                    this.elements.appSelector.disabled = true;
                    return;
                }
                const selectedOption = selector.querySelector(`option[value="${spaceId}"]`);
                const apps = JSON.parse(selectedOption.dataset.apps);
                this.ui.renderAppSelector(apps);
            },

            handleAppSelect: async function(appId) {
                if (!appId) {
                    this.history.updatePresent({ items: [], appFields: [], selectedItemIds: new Set() }, true);
                    return;
                }
                await this.api.fetchAppAndItems(appId);
            },

            handleSelectAll: function(isChecked) {
                const newSelectedIds = new Set();
                if (isChecked) {
                    this.state.editor.present.items.forEach(item => newSelectedIds.add(item.item_id));
                }
                this.history.updatePresent({ selectedItemIds: newSelectedIds });
            },

            handleSelectItem: function(itemId, isChecked) {
                const newSelectedIds = new Set(this.state.editor.present.selectedItemIds);
                if (isChecked) {
                    newSelectedIds.add(itemId);
                } else {
                    newSelectedIds.delete(itemId);
                }
                this.history.updatePresent({ selectedItemIds: newSelectedIds });
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            PodioBulkEditor.init();
        });
    }());
    </script>
</body>
</html>
